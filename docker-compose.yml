version: '3.8'

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: StrongPassword2026!
      MYSQL_DATABASE: wordpress_db
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: StrongUserPassword2026!
    networks:
      - backend-net
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin_tool
    restart: always
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: StrongPassword2026!
    networks:
      - backend-net
      - frontend-net

  wordpress:
    image: wordpress:latest
    container_name: wordpress_app
    restart: always
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: StrongUserPassword2026!
      WORDPRESS_DB_NAME: wordpress_db
    networks:
      - frontend-net
      - backend-net
    volumes:
      - wp_data:/var/www/html

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend-net
    depends_on:
      - wordpress
      - phpmyadmin

volumes:
  db_data:
  wp_data:
