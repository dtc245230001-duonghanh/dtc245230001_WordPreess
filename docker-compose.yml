version: '3.8'

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  monitoring-net:
    driver: bridge

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: StrongPassword2026!
      MYSQL_DATABASE: wordpress_db
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: StrongUserPassword2026!
    networks:
      - backend-net
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin_tool
    restart: always
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: StrongPassword2026!
    networks:
      - backend-net
      - frontend-net

  wordpress:
    image: wordpress:latest
    container_name: wordpress_app
    restart: always
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: StrongUserPassword2026!
      WORDPRESS_DB_NAME: wordpress_db
    networks:
      - frontend-net
      - backend-net
    volumes:
      - wp_data:/var/www/html

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend-net
    depends_on:
      - wordpress
      - phpmyadmin

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_monitor
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    networks:
      - monitoring-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor_collector
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_dashboard
    restart: always
    ports:
      - "3001:3000"
    networks:
      - monitoring-net

  loki:
    image: grafana/loki:2.9.2
    container_name: loki_logs
    restart: always
    user: "0:0"
    ports:
      - "3101:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./loki/data:/tmp/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - monitoring-net

  promtail:
    image: grafana/promtail:2.9.2
    container_name: promtail_collector
    restart: always
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - monitoring-net
    depends_on:
      - loki

volumes:
  db_data:
  wp_data:
